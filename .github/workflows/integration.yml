name: Интеграция

# Вызывает общую проверку из мета-репозитория: она собирает весь воркспейс
# с ревизией этого PR на месте папки posting_team. Тело — там, в одном экземпляре
# на все шесть команд.
#
# Подключение по тегу, а не по @main: правка в общем workflow иначе ломала бы
# CI шести команд разом и без предупреждения. Тот же довод, по которому пакеты
# подключаются через from:, а не веткой.
#
# secrets: inherit передаёт WORKSPACE_DISPATCH_TOKEN — им job notify сообщает
# мета-репозиторию о мерже. Без секрета всё работает, кроме пересборки
# воркспейса после мержа.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    uses: yklishevich/kufar-ios-demo/.github/workflows/team-integration.yml@v1
    with:
      team: posting_team
    secrets: inherit
