name: Integration

# Calls the shared check from the meta repository: it builds the whole workspace
# with this PR's revision in place of the posting_team folder. The body lives there, in
# a single copy shared by all six teams.
#
# Referenced by tag rather than by @main: otherwise an edit to the shared
# workflow would break six teams' CI at once and without warning. The same
# argument by which packages are referenced with from: rather than by branch.
#
# secrets: inherit passes WORKSPACE_DISPATCH_TOKEN — the notify job uses it to
# tell the meta repository about a merge. Without the secret everything works
# except rebuilding the workspace after a merge.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    uses: yklishevich/kufar-ios-demo/.github/workflows/team-integration.yml@v1
    with:
      team: posting_team
    secrets: inherit
